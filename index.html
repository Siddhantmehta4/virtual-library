<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sid's Library</title>
  <meta name="description" content="A personal library: every book I've read, on one walnut bookcase.">
  <meta property="og:title" content="Sid's Library">
  <meta property="og:description" content="A personal library: every book I've read, on one walnut bookcase.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2f3420">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="room" id="room">
    <div class="wall-light" aria-hidden="true"></div>
    <div class="stage" id="stage">
      <p class="status" id="status">Taking the books off the cart…</p>
      <div class="bookcase" id="bookcase" aria-label="Bookcase"></div>
    </div>
    <div class="floor" aria-hidden="true"></div>
  </main>

  <section class="zoom" id="zoom" aria-hidden="true">
    <header class="zoom-head">
      <button class="back-btn" id="zoomBack" type="button">← Back to the case</button>
      <div class="zoom-plate" id="zoomPlate"></div>
      <span class="zoom-count" id="zoomCount"></span>
    </header>
    <div class="rail-wrap" id="railWrap">
      <div class="rail" id="rail"></div>
    </div>
  </section>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-dim" id="detailDim"></div>
    <div class="fly-wrap"><div class="fly" id="fly"></div></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </section>

  <div class="hover-card" id="hoverCard" role="tooltip"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
