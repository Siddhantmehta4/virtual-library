<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sid's Library</title>
  <meta name="description" content="Welcome to my library: every book I've read, on one walnut bookcase.">
  <meta property="og:title" content="Sid's Library">
  <meta property="og:description" content="Welcome to my library: every book I've read, on one walnut bookcase.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://siddhantmehta4.github.io/virtual-library/">
  <meta property="og:image" content="https://siddhantmehta4.github.io/virtual-library/assets/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://siddhantmehta4.github.io/virtual-library/assets/preview.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 28V12a10 10 0 0 1 20 0v16z' fill='%233b2416' stroke='%23c9a96a' stroke-width='2'/%3E%3Crect x='10' y='17' width='3' height='10' fill='%23a33'/%3E%3Crect x='14' y='15' width='4' height='12' fill='%23ddd3bb'/%3E%3Crect x='19' y='18' width='3' height='9' fill='%2335506a'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#3a3522">
  <link rel="preload" as="image" href="assets/room.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Karla:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="ext ext-top" id="extTop" aria-hidden="true"></div>
    <div class="ext ext-bottom" id="extBottom" aria-hidden="true"></div>
    <div class="stage" id="stage">
      <img class="photo" id="photo" src="assets/room.jpg" width="2912" height="1632" alt="A dark walnut bookcase with three arches against an olive green wall">
      <img class="photo-ext wall" id="extWall" src="assets/room-wall.jpg" width="2912" height="849" alt="" aria-hidden="true">
      <img class="photo-ext floor" id="extFloor" src="assets/room-floor.jpg" width="2912" height="869" alt="" aria-hidden="true">
      <div class="depth" id="depth" aria-hidden="true"></div>
      <div class="wall-title" id="wallTitle">
        <h1 class="welcome"><span>Welcome</span> <span>to</span> <span>my</span> <span>library</span></h1>
        <p class="volumes" id="volumes"></p>
      </div>
      <div class="lamp-glow" id="lampGlow" aria-hidden="true"></div>
      <div class="bays" id="bays" aria-label="Bookcase"></div>
      <div class="objects" id="objects"></div>
      <div class="curtain" id="curtain" aria-hidden="true"><div></div><div></div><div></div><div></div></div>
    </div>
    <p class="status" id="status" role="status"></p>
  </main>

  <header class="zoom-head" id="zoomHead">
    <button class="back-btn" id="zoomBack" type="button">← Back to the case</button>
    <div class="zoom-plate" id="zoomPlate"></div>
    <span class="zoom-count" id="zoomCount"></span>
  </header>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-dim" id="detailDim"></div>
    <div class="fly-wrap"><div class="fly" id="fly"></div></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </section>

  <div class="hover-card" id="hoverCard" role="tooltip"></div>

  <button class="help" id="help" type="button" aria-label="How to explore" aria-expanded="false">?</button>
  <div class="help-note" id="helpNote" role="note">Hover anything brass, pixel, or framed.</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
